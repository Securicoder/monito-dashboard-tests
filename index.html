<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cydenti NHI Explorer</title>
  
  <!-- Primary CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js" crossorigin="anonymous"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    // Wait for tailwind to load (or fail) before configuring
    window.onload = function() {
      if (typeof tailwind !== 'undefined') {
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
              },
              colors: {
                cydenti: {
                  teal: '#14b8a6',
                  cyan: '#06b6d4',
                  blue: '#1d4ed8',
                  dark: '#0f172a',
                  card: '#ffffff',
                  border: '#e2e8f0'
                },
                risk: {
                  critical: '#ef4444',
                  high: '#f97316',
                  medium: '#eab308',
                  low: '#22c55e'
                }
              }
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Critical CSS Fallback in case Tailwind fails completely */
    body {
      background-color: #f8fafc;
      color: #0f172a;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      margin: 0;
    }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .h-screen { height: 100vh; }
    .w-full { width: 100%; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    .graph-container {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    .graph-container:active {
      cursor: grabbing;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://esm.sh/rxjs@^7.8.1?conditions=es2015",
    "rxjs/operators": "https://esm.sh/rxjs@^7.8.1/operators?conditions=es2015",
    "rxjs/ajax": "https://esm.sh/rxjs@^7.8.1/ajax?conditions=es2015",
    "rxjs/webSocket": "https://esm.sh/rxjs@^7.8.1/webSocket?conditions=es2015",
    "rxjs/testing": "https://esm.sh/rxjs@^7.8.1/testing?conditions=es2015",
    "rxjs/fetch": "https://esm.sh/rxjs@^7.8.1/fetch?conditions=es2015",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@18.2.0?external=rxjs",
    "@angular/common": "https://esm.sh/@angular/common@18.2.0?external=rxjs",
    "@angular/compiler": "https://esm.sh/@angular/compiler@18.2.0?external=rxjs",
    "@angular/core": "https://esm.sh/@angular/core@18.2.0?external=rxjs",
    "@angular/forms": "https://esm.sh/@angular/forms@18.2.0?external=rxjs"
  }
}
</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
